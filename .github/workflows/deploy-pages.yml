name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal homepage
        uses: actions/checkout@v6
        with:
          path: personal-site

      - name: Assemble personal homepage
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            personal-site/ _site/

          touch _site/.nojekyll

          test -f _site/index.html

      - name: Add published pages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAGE_REPO_TOKEN }}
        run: |
          set -euo pipefail

          mkdir -p _page_sources

          while IFS= read -r page; do
            path="$(jq -r '.path' <<< "$page")"
            type="$(jq -r '.type' <<< "$page")"
            repo="$(jq -r '.repo' <<< "$page")"
            ref="$(jq -r '.ref' <<< "$page")"

            echo "Publishing [$type] $repo@$ref -> /$path/"

            if [[ -z "$path" || "$path" == /* || "$path" == *".."* ]]; then
              echo "Invalid page path: $path"
              exit 1
            fi

            checkout_dir="_page_sources/$(echo "$repo" | tr '/' '_')"

            gh repo clone "$repo" "$checkout_dir" -- \
              --branch "$ref" \
              --depth 1

            mkdir -p "_site/$path"

            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='.gitignore' \
              --exclude='README*' \
              --exclude='LICENSE*' \
              --exclude='package*.json' \
              --exclude='node_modules' \
              "$checkout_dir/" "_site/$path/"

            test -f "_site/$path/index.html"
          done < <(
            jq -c \
              '.pages[] | select(.publish == true)' \
              personal-site/.github/pages.json
          )

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4